version: "3.8"

services:
  selenoid:
    image: aerokube/selenoid:latest-release
    restart: unless-stopped
    networks:
      - selenoid
    ports:
      - "4444:4444"
    volumes:
      - "./config:/etc/selenoid:ro"
      - "./video:/opt/selenoid/video"
      - "./logs:/opt/selenoid/logs"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR
    command:
      - "-conf"
      - "/etc/selenoid/browsers.json"
      - "-container-network"
      - "selenoid"
      - "-video-output-dir"
      - "/opt/selenoid/video"
      - "-log-output-dir"
      - "/opt/selenoid/logs"
      - "-limit"
      - "5"
    shm_size: "2gb"

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    restart: unless-stopped
    networks:
      - selenoid
    depends_on:
      - selenoid
    ports:
      - "8080:8080"
    command:
      - "--selenoid-uri"
      - "http://selenoid:4444"

networks:
  selenoid:
    name: selenoid
